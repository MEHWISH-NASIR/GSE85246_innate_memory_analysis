format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    number-sections: false
    code-fold: true
    code-tools: false
    link-external-newwindow: true
    css: styles.css

execute:
  echo: false
  warning: false
  message: false
  freeze: auto
