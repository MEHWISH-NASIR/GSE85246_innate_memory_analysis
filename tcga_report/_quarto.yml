project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - jak3.qmd
    - methods.qmd

website:
  title: "TCGA Pan-Cancer Kinase Exploration"
  page-navigation: true
  search: true

  navbar:
    left:
      - href: index.qmd
        text: Overview
      - href: jak3.qmd
        text: JAK3
      - href: methods.qmd
